[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Legacy modules with a typing modernisation in flight (Dict/Tuple -> dict/tuple
# and import ordering). They are excluded from the strict gate until the
# maintainer's change lands; every other file must stay clean.
"app.py" = ["I001", "UP006", "UP035"]
"src/predict.py" = ["I001", "UP006", "UP035"]
"src/train.py" = ["I001", "UP006", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
